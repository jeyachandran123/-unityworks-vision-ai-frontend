# unityworks-team project configuration — format: the plugin's team-setup skill.
# One "key = value" per line; repeat a key for a list; " :: " separates parts.

name    = Vision AI frontend
kind    = vision-frontend
reviews = docs/reviews
related = backend :: vision-backend

generated = src/shared/types/openapi.ts :: python scripts/export_openapi.py in the backend, then npm run types:generate here (contract-sync skill). scripts/generate-types.mjs is its only author.

gate = src/ tests/ scripts/ vite.config.ts eslint.config.js tsconfig package.json :: npm run verify :: npm run verify

check = contract :: bash .claude/team/checks/contract-check

harden = default :: frontend-engineer ux-architect qa-engineer security-engineer
harden = frontend :: frontend-engineer ux-architect product-analyst qa-engineer
harden = contract :: devops-engineer frontend-engineer
harden = release :: devops-engineer release-scribe product-analyst security-engineer architecture-auditor

release-skill = prod-readiness
